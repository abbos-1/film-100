name: Build APK

on:
  push:
    branches: [main, android-app]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk film100.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: film100-apk
          path: film100.apk

      - name: Publish release (branch build)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/android-app'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "100 фильмов, сборка ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          body: "Скачай film100.apk и установи на телефон."
          files: film100.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: film100.apk
