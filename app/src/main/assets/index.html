<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: iOS-style single column. Sticky blurred bar, large title, inset grouped lists with round checks, bottom sheet for appearance. */
:root {
  --bg: #F2F2F7;
  --surface: #FFFFFF;
  --ink: #0B0B0F;
  --muted: #6C6C70;
  --line: #DEDEE3;
  --track: #E3E3E8;
  --accent: #007AFF;
  --accent-ink: #FFFFFF;
  --bar: rgba(242, 242, 247, 0.82);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --surface: #1C1C1E;
    --ink: #F5F5F7;
    --muted: #8E8E93;
    --line: #38383A;
    --track: #2C2C2E;
    --accent: #0A84FF;
    --bar: rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --surface: #1C1C1E;
  --ink: #F5F5F7;
  --muted: #8E8E93;
  --line: #38383A;
  --track: #2C2C2E;
  --accent: #0A84FF;
  --bar: rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.3;
  padding-block: 0 48px;
  transition: background-color .25s ease, color .25s ease;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font-family: inherit; }

.pad {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.in { max-width: 640px; margin-inline: auto; }

/* sticky bar */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid transparent; transition: border-color .2s ease;
}
.nav.scrolled { border-bottom-color: var(--line); }
.nav-in { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 48px; }
.nav-t { text-align: center; font-weight: 600; font-size: 17px; opacity: 0; transition: opacity .2s ease; }
.nav.scrolled .nav-t { opacity: 1; }
.ib {
  justify-self: end; width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  color: var(--accent); background: var(--surface); border: 1px solid var(--line);
}
.ib:active { transform: scale(.94); }

h1 { margin: 2px 0 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: .01em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

.stack { display: grid; gap: 14px; margin-top: 16px; }

.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--track); border-radius: 10px; padding: 0 10px; height: 36px; color: var(--muted);
}
.search input {
  flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: var(--ink);
  font: inherit; font-size: 17px; outline: none;
}
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }

.card {
  background: var(--surface); border-radius: 12px; border: 1px solid var(--line); overflow: hidden;
  transition: background-color .25s ease;
}
.prog { padding: 14px 16px 16px; display: grid; gap: 12px; }
.prog-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.lbl { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .03em; }
.big { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.big b { font-size: 34px; line-height: 1.1; font-weight: 700; color: var(--ink); letter-spacing: .01em; }
.pct { font-size: 22px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.track { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .3s ease; }

.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: var(--track); border-radius: 9px; padding: 2px; gap: 2px;
}
.seg button {
  min-width: 0; font-size: 13px; font-weight: 500; color: var(--ink);
  border: 0; background: transparent; padding: 7px 4px; border-radius: 7px; cursor: pointer;
  white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }

/* lists */
.sec { margin-top: 26px; }
.sec[hidden] { display: none; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 16px 6px; }
.sec-h h2 { margin: 0; font-size: 13px; font-weight: 400; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.cnt { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.grid { list-style: none; margin: 0; padding: 0; }
.row { position: relative; min-width: 0; }
.row[hidden] { display: none; }
.row::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; height: 1px; background: var(--line); }
.row.first::before { display: none; }
.row label { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 9px 16px; cursor: pointer; position: relative; min-width: 0; }
.row label:active { background: var(--track); }
.row input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.box {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--muted); display: grid; place-items: center;
  transition: background-color .15s ease, border-color .15s ease;
}
.box svg { width: 14px; height: 14px; opacity: 0; transform: scale(.4); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), opacity .12s ease; stroke: var(--accent-ink); }
input:checked ~ .box { background: var(--accent); border-color: var(--accent); }
input:checked ~ .box svg { opacity: 1; transform: scale(1); }
input:focus-visible ~ .box { outline: 2px solid var(--accent); outline-offset: 3px; }
.txt { display: grid; gap: 1px; min-width: 0; }
.t { font-size: 17px; overflow-wrap: anywhere; }
.m { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row.done .t { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }

.empty { margin: 36px 0 0; text-align: center; color: var(--muted); }
.empty[hidden] { display: none; }

/* appearance sheet */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .3); opacity: 0; transition: opacity .28s ease; z-index: 40; }
.scrim.open { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; margin-inline: auto; width: 100%; max-width: 560px;
  max-height: 86%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); color: var(--ink); border-radius: 14px 14px 0 0;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .22);
  transform: translateY(105%); transition: transform .34s cubic-bezier(.2, .85, .25, 1); z-index: 41;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.open { transform: none; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--track); margin: 8px auto 0; }
.sh-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 4px; }
.sh-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
.txtbtn { border: 0; background: transparent; color: var(--accent); font-size: 17px; font-weight: 600; padding: 8px 4px; cursor: pointer; }
.sh-body { display: grid; gap: 4px; padding-block: 8px 20px; }
.sec-l { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 16px 6px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .03em; }
.hint { text-transform: none; letter-spacing: 0; }
.pick { padding: 12px; display: grid; gap: 14px; }
.sw-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; padding: 2px 4px 4px; }
.sw {
  aspect-ratio: 1; width: 100%; max-width: 46px; justify-self: center; border-radius: 50%; padding: 0; cursor: pointer;
  border: 1px solid rgba(128, 128, 128, .4); display: grid; place-items: center;
}
.pick .seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--ink) 18%, var(--surface)); box-shadow: none; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.sw svg { width: 18px; height: 18px; }
.reset {
  margin: 14px 0 0; width: 100%; border: 1px solid var(--line); background: var(--surface); color: #FF3B30;
  font-size: 17px; padding: 13px; border-radius: 12px; cursor: pointer;
}

@media (max-width: 340px) { .seg button { font-size: 12px; } }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<div class="nav" id="nav">

    </button>
  </div></div>
</div>

<main class="pad"><div class="in">
  <h1>Фильмы</h1>
  <p class="sub">100 фильмов и все части их франшиз</p>

  <div class="stack">
    <label class="search">

      <input id="q" type="search" placeholder="Поиск" autocomplete="off" aria-label="Поиск по названию">
    </label>

    <div class="card prog">
      <div class="prog-top">
        <div>
          <div class="lbl">Просмотрено</div>
          <div class="big"><b id="doneN">0</b> из <span id="totalN">0</span></div>
        </div>
        <div class="pct" id="pct">0%</div>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>

    <div class="seg" id="filters" role="group" aria-label="Фильтр">
      <button type="button" data-f="all" aria-pressed="true">Все</button>
      <button type="button" data-f="todo" aria-pressed="false">Осталось</button>
      <button type="button" data-f="done" aria-pressed="false">Просмотрено</button>
    </div>
  </div>

  <div id="list"></div>
  <p class="empty" id="empty" hidden>Здесь пока пусто.</p>
</div></main>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT" hidden>
  <div class="grab"></div>
  <div class="sh-head pad">
    <h2 id="sheetT">Оформление</h2>
    <button class="txtbtn" id="done" type="button">Готово</button>
  </div>
  <div class="pad sh-body">
    <div class="sec-l"><span>Фон</span><span class="hint" id="hint-bg"></span></div>
    <div class="card pick" id="pick-bg"></div>
    <div class="sec-l"><span>Акцент</span><span class="hint" id="hint-ac"></span></div>
    <div class="card pick" id="pick-ac"></div>
    <button class="reset" id="reset" type="button">Сбросить оформление</button>
  </div>
</div>

  var LS = "movies100.done", TS = "movies100.theme";
  var done = new Set(), rows = {}, secs = [], filter = "all", q = "", total = 0;

  function $(id) { return document.getElementById(id); }

  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }

  /* ---------- colour maths ---------- */
  function h2r(h) { h = h.replace("#", ""); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
  function r2h(r) { return "#" + r.map(function (v) { return Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0"); }).join(""); }
  function mix(a, b, t) { var x = h2r(a), y = h2r(b); return r2h([0, 1, 2].map(function (i) { return x[i] * (1 - t) + y[i] * t; })); }
  function lum(h) {
    var c = h2r(h).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function cr(a, b) { var l1 = lum(a), l2 = lum(b); if (l1 < l2) { var t = l1; l1 = l2; l2 = t; } return (l1 + 0.05) / (l2 + 0.05); }

  /* ---------- palettes ---------- */
  var FAM = [{ k: "white", n: "Белый" }, { k: "black", n: "Чёрный" }, { k: "purple", n: "Фиолетовый" }, { k: "blue", n: "Синий" }];
  var PAL = {
    bg: {
      white: ["#FFFFFF", "#F8F8FA", "#F2F2F7", "#ECECF1", "#E3E3E8", "#D8D8DE"],
      black: ["#000000", "#0B0B0D", "#141416", "#1C1C1E", "#2C2C2E", "#3A3A3C"],
      purple: ["#F4EFFE", "#DCCDFB", "#B197F2", "#7C4DDB", "#4B2A9B", "#241346"],
      blue: ["#EAF3FF", "#CFE3FF", "#8DBBFF", "#2F6FE0", "#12419C", "#071B40"]
    },
    ac: {
      white: ["#FFFFFF", "#F2F2F7", "#E5E5EA", "#C7C7CC", "#AEAEB2", "#8E8E93"],
      black: ["#000000", "#1C1C1E", "#2C2C2E", "#3A3A3C", "#48484A", "#636366"],

  };
  var theme = { bg: null, ac: null };
  var ui = { bg: "white", ac: "blue" };

  function findColor(kind, hex) {
    if (!hex) return null;
    for (var i = 0; i < FAM.length; i++) {
      var list = PAL[kind][FAM[i].k];
      for (var j = 0; j < list.length; j++) {
        if (list[j].toLowerCase() === hex.toLowerCase()) return { fam: FAM[i], idx: j };
      }

    return null;

  var OVERRIDES = ["--bg", "--surface", "--ink", "--muted", "--line", "--track", "--bar", "--accent", "--accent-ink"];

      var B = theme.bg;
      var ink = cr(B, "#0B0B0F") >= cr(B, "#F5F5F7") ? "#0B0B0F" : "#F5F5F7";
      var dark = ink === "#F5F5F7";
      var rgb = h2r(B);
      st.setProperty("--bg", B);
      st.setProperty("--ink", ink);

  /* ---------- sync (local + per-user db) ---------- */
  function makeSync(build, adopt, hasLocal) {
    var ref = null, timer = null, busy = false, again = false, first = true;
    var api = {};
    async function flush() {
      timer = null;
      if (busy) { again = true; return; }
      busy = true;
      try { await ref.set(build()); } catch (e) {}
      busy = false;
      if (again) { again = false; flush(); }
    }
    api.dirty = function () {
      if (!ref) return;
      clearTimeout(timer);
      timer = setTimeout(flush, 350);
    };
    api.attach = function (r) {
      ref = r;
      r.onSnapshot(function (s) {
        if (timer || busy || again) return;
        var d = s.exists ? s.data() : null;

      }, function () {});
    };

  }

  var movieSync = makeSync(
    function () { return { done: Array.from(done) }; },

  function update() {
    var any = false;

      var d = 0, vis = 0;
      s.ids.forEach(function (id) {

  /* ---------- appearance sheet ---------- */
  function syncUI() {

  function renderPick(kind, focusSel) {

    applyTheme();

  var sheet = $("sheet"), scrim = $("scrim"), opener = null;

    if (sheet.hidden) return;
    scrim.classList.remove("open"); sheet.classList.remove("open");
    var fin = function () { scrim.hidden = true; sheet.hidden = true; };
    if (reduce) fin(); else setTimeout(fin, 340);
    if (opener && opener.focus) opener.focus();
  }
  $("openSheet").addEventListener("click", openSheet);
  $("done").addEventListener("click", closeSheet);
  scrim.addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) {
    if (sheet.hidden) return;
    if (e.key === "Escape") { closeSheet(); return; }
    if (e.key === "Tab") {
      var f = sheet.querySelectorAll("button");
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* ---------- boot ---------- */
  var savedTheme = lsGet(TS);
  if (savedTheme && typeof savedTheme === "object") { theme.bg = validHex(savedTheme.bg); theme.ac = validHex(savedTheme.ac); }
  syncUI();
  applyTheme();
  renderPicks();

  var savedDone = lsGet(LS);
  if (Array.isArray(savedDone)) savedDone.forEach(function (id) { if (rows[id]) done.add(id); });
  update();

  (async function () {
    try {
      if (!window.claude || !claude.use) return;
      var db = await claude.use("db");
      var user = await claude.use("user");
      if (!db || !user) return;
      var uid = await user.id();
      if (!uid) return;
      movieSync.attach(db.doc("data/users/" + uid + "/movies"));
      themeSync.attach(db.doc("data/users/" + uid + "/settings"));
    } catch (e) {}
  })();
})();

<script>
/* Android: tell the native shell which colour the page background is, so system bars match. */
(function () {
  function hex(h) { h = h.replace("#", ""); return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function lum(h) {
    var c = hex(h).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function push() {
    try {
      if (!window.AndroidBridge) return;
      var b = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      if (!/^#[0-9a-f]{6}$/i.test(b)) return;
      window.AndroidBridge.setTheme(b, lum(b) < 0.4);
    } catch (e) {}
  }
  new MutationObserver(push).observe(document.documentElement, { attributes: true, attributeFilter: ["style", "data-theme"] });
  try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", push); } catch (e) {}
  window.addEventListener("load", function () { push(); setTimeout(push, 300); });
  push();
})();
</script>
